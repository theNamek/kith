[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name: "kith" on PyPI is squatted by a dead 2016 package
# (PEP 541 transfer request is an option later). Import name stays `kith`.
name = "kith-ai"
version = "0.1.0"
description = "Social memory for multi-agent systems: who remembers what, about whom, visible to whom."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Yan Liu" }]
keywords = ["agents", "multi-agent", "memory", "llm", "trust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/theNamek/kith"

[tool.hatch.build.targets.wheel]
packages = ["src/kith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
